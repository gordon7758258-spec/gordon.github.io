<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#81c784">
    <title>舒尔特方格 - 专注力训练</title>
    <!-- 引入Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== 全局重置与基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: #f5f5f0;
            color: #3a3a3a;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #4a5d4a;
        }

        /* 昵称输入框 */
        .nickname-bar {
            width: 100%;
            max-width: 500px;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nickname-input {
            flex: 1;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
            outline: none;
        }
        .nickname-input:focus {
            border-color: #81c784;
        }

        /* ========== 计时显示区域 ========== */
        .timer-panel {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .timer-item {
            font-size: 1rem;
            font-weight: 500;
            color: #555;
        }

        .countdown-display {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2e7d32;
            transition: all 0.3s ease;
            min-width: 80px;
            text-align: right;
        }

        .countdown-display.danger {
            color: #c62828;
            font-size: 1.8rem;
            animation: shake 0.4s infinite ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        /* ========== 提示文本 ========== */
        .tip-bar {
            margin-bottom: 14px;
            font-size: 1rem;
            color: #666;
            height: 1.6rem;
            font-weight: 500;
        }
        .tip-bar.error {
            color: #c62828;
            font-weight: 600;
        }
        /* ========== 难度选择按钮 ========== */
        .difficulty-group {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            width: 100%;
            max-width: 500px;
        }

        .btn {
            flex: 1;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            background-color: #e8e8e0;
            color: #555;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .btn.active {
            background-color: #81c784;
            color: white;
            box-shadow: 0 2px 8px rgba(129, 199, 132, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* ========== 方格网格 ========== */
        .grid-container {
            width: 100%;
            max-width: 500px;
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            touch-action: manipulation;
        }

        .grid-cell.completed {
            background-color: #a5d6a7 !important;
            color: #1b5e20;
            cursor: default;
            box-shadow: 0 2px 4px rgba(27, 94, 32, 0.15);
        }

        .grid-cell.completed::after {
            content: "✓";
            position: absolute;
            font-size: 1rem;
            bottom: 4px;
            right: 6px;
            color: #2e7d32;
            font-weight: bold;
        }

        .grid-cell.error {
            background-color: #ef9a9a !important;
            animation: error-flash 0.3s ease;
        }

        @keyframes error-flash {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .grid-cell.win-celebration {
            animation: win-pop 0.7s ease-in-out;
        }

        /* 游戏未开始时，非1数字模糊遮罩 */
        .grid-cell.blur-hide {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: rgba(60,60,60,0.4) !important;
            color: transparent !important;
            pointer-events: none; /* 模糊格子开局前禁止点击 */
        }
        
        @keyframes win-pop {
            0% { transform: scale(1); }
            30% { transform: scale(1.15); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        /* ========== 重新开始按钮 ========== */
        .restart-button {
            width: 100%;
            max-width: 500px;
            min-height: 50px;
            margin-bottom: 22px;
            background-color: #64b5f6;
            color: white;
            font-size: 1.05rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.3);
            touch-action: manipulation;
        }

        .restart-button:active {
            background-color: #42a5f5;
            transform: scale(0.98);
        }

        /* ========== 成绩面板 ========== */
        .score-panel {
            width: 100%;
            max-width: 500px;
            background-color: white;
            padding: 14px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .score-panel h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #4a5d4a;
            font-weight: 600;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.9rem;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
        }

        .score-row:last-child {
            border-bottom: none;
        }

        /* 排行榜样式 */
        .rank-item {
            display: grid;
            grid-template-columns: 30px 1fr auto auto;
            gap: 10px;
            align-items: center;
            padding: 6px 0;
            font-size: 0.88rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .rank-num {
            font-weight: bold;
            color: #888;
        }
        .rank-num.top1 { color: #ff8f00; }
        .rank-num.top2 { color: #90a4ae; }
        .rank-num.top3 { color: #8d6e63; }
        .rank-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-time { color: #2e7d32; font-weight: 500; }
        .rank-level { font-size: 0.8rem; color: #999; }

        /* ========== 结果弹窗 ========== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .modal-mask.show {
            display: flex;
        }

        .modal-card {
            background-color: white;
            padding: 28px 24px;
            border-radius: 14px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .modal-card h2 {
            margin-bottom: 18px;
            color: #333;
            font-size: 1.4rem;
        }

        .modal-card p {
            margin: 10px 0;
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
        }

        .modal-confirm-btn {
            margin-top: 24px;
            width: 100%;
            min-height: 50px;
            background-color: #81c784;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
        }

        .modal-confirm-btn:active {
            background-color: #66bb6a;
        }

        /* ========== 小屏适配 ========== */
        @media (max-width: 360px) {
            .grid-cell { font-size: 1.2rem; }
            .countdown-display { font-size: 1.2rem; }
            .countdown-display.danger { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <h1>舒尔特方格</h1>

    <!-- 昵称输入栏 -->
    <div class="nickname-bar">
        <input type="text" class="nickname-input" id="nicknameInput" placeholder="输入你的昵称（用于同步成绩）" maxlength="12">
    </div>

    <!-- 计时面板 -->
    <div class="timer-panel">
        <div class="timer-item">
            用时：<span id="elapsedTime">00:00.000</span>
        </div>
        <div class="timer-item">
            剩余：<span id="countdown" class="countdown-display">25.0</span>
        </div>
    </div>

    <!-- 提示栏 -->
    <div class="tip-bar" id="tipText">点击数字 1 开始挑战</div>

    <!-- 难度选择 -->
    <div class="difficulty-group">
        <button class="btn" data-level="3">简单 3×3</button>
        <button class="btn active" data-level="5">标准 5×5</button>
        <button class="btn" data-level="6">困难 6×6</button>
    </div>

    <!-- 方格容器 -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- 重新开始按钮 -->
    <button class="restart-button" id="restartBtn">重新开始</button>

    <!-- 个人最佳成绩 -->
    <div class="score-panel">
        <h3>我的最佳成绩</h3>
        <div id="bestScoresList"></div>
        <div class="score-row">
            <span>本局累计错误</span>
            <span id="totalErrorCount">0</span>
        </div>
    </div>

    <!-- 全服排行榜 -->
    <div class="score-panel">
        <h3 id="rankTitle">🏆 全服排行榜（标准5×5）</h3>
        <div id="rankList"></div>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal-mask" id="resultModal">
        <div class="modal-card">
            <h2 id="modalTitle">挑战完成！</h2>
            <p id="modalTime">用时：00:00.000</p>
            <p id="modalErrors">错误次数：0 次</p>
            <p id="modalProgress" style="color: #888;"></p>
            <button class="modal-confirm-btn" id="modalCloseBtn">再来一次</button>
        </div>
    </div>

    <script>
        // ===================== 请替换成你自己的Supabase参数 =====================
        const SUPABASE_URL = "https://tjtqutpnimllkzsmqfbb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqdHF1dHBuaW1sbGt6c21xZmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxOTc2NjMsImV4cCI6MjEwMDc3MzY2M30.PGrAXVzJd9Yys8yMo2ap5kfYvffGgl9xqs3BZWz1E8c";
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // =====================================================================

        // ========== PWA 配置 ==========
        (function initPWA() {
            const manifestData = {
                name: "舒尔特方格专注力训练",
                short_name: "舒尔特方格",
                start_url: location.pathname,
                scope: location.pathname,
                display: "standalone",
                background_color: "#f5f5f0",
                theme_color: "#81c784",
                icons: [{
                    src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgZmlsbD0iIzgxYzc4NCIgcng9IjMyIi8+PHRleHQgeD0iOTYiIHk9IjEyMCIgZm9udC1zaXplPSI4MCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiPlM8L3RleHQ+PC9zdmc+",
                    sizes: "192x192",
                    type: "image/svg+xml"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);

            if ('serviceWorker' in navigator && location.protocol !== 'file:') {
                const swCode = `
                    const CACHE_NAME = 'schulte-grid-v2';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.add('/')));
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        })();

        // ========== 游戏核心配置 ==========
        const GAME_CONFIG = {
            3: { total: 9,  timeLimit: 12000, label: '简单 3×3' },
            5: { total: 25, timeLimit: 25000, label: '标准 5×5' },
            6: { total: 36, timeLimit: 40000, label: '困难 6×6' }
        };

        // ========== 游戏状态变量 ==========
        let currentLevel = 5;
        let targetNumber = 1;
        let errorCount = 0;
        let gameState = 'idle'; // idle / playing / ended
        let startTime = 0;
        let elapsed = 0;
        let remainingTime = 0;
        let timerId = null;
        let numbers = [];

        // DOM 元素
        const gridContainer = document.getElementById('gridContainer');
        const tipText = document.getElementById('tipText');
        const elapsedEl = document.getElementById('elapsedTime');
        const countdownEl = document.getElementById('countdown');
        const restartBtn = document.getElementById('restartBtn');
        const difficultyBtns = document.querySelectorAll('.difficulty-group .btn');
        const resultModal = document.getElementById('resultModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalTime = document.getElementById('modalTime');
        const modalErrors = document.getElementById('modalErrors');
        const modalProgress = document.getElementById('modalProgress');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const bestScoresList = document.getElementById('bestScoresList');
        const rankTitle = document.getElementById('rankTitle');
        const nicknameInput = document.getElementById('nicknameInput');
        const totalErrorCountEl = document.getElementById('totalErrorCount');
        
        // 初始化昵称（从本地存储读取）
        nicknameInput.value = localStorage.getItem('schulte_nickname') || '';

        // 昵称变化时：保存 + 刷新个人成绩（回车或失焦时触发，避免输入时频繁刷新）
        
        nicknameInput.addEventListener('input', () => {
            const currentNick = nicknameInput.value.trim();
            localStorage.setItem('schulte_nickname', currentNick);
            
            // 实时刷新：边输入昵称，边更新最佳成绩面板
            updateBestScoresDisplay();
            // 实时刷新累计总错误次数
            refreshTotalErrorUI();
        
            // 游戏未开局时，输入文字自动清除昵称错误提示
            if (gameState === 'idle') {
                tipText.textContent = '点击数字 1 开始挑战';
                tipText.classList.remove('error');
            }
        });
        nicknameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                nicknameInput.blur(); // 回车自动失焦，触发刷新
            }
        });

        // ========== 工具函数 ==========
        function shuffleNumbers(size) {
            const total = size * size;
            const arr = Array.from({ length: total }, (_, i) => i + 1);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getSoftColor(index, total) {
            const hue = (index / total) * 360;
            return `hsl(${hue}, 32%, 88%)`;
        }

        function formatElapsedTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor(ms % 1000);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
        }

        function formatCountdown(ms) {
            const seconds = Math.floor(ms / 1000);
            const tenths = Math.floor((ms % 1000) / 100);
            return `${seconds}.${tenths}`;
        }

        function triggerVibration() {
            if (navigator.vibrate) navigator.vibrate(60);
        }

        // ========== 游戏核心逻辑 ==========
        function renderGrid() {
            const size = currentLevel;
            const total = size * size;
            numbers = shuffleNumbers(size);
            
            gridContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            gridContainer.innerHTML = '';
        
            numbers.forEach((num, index) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                // 待机状态：除数字1外全部模糊遮挡
                if(num !== 1) cell.classList.add('blur-hide');
                cell.textContent = num;
                cell.dataset.number = num;
                cell.style.backgroundColor = getSoftColor(index, total);
                cell.addEventListener('click', () => handleCellClick(cell, num));
                gridContainer.appendChild(cell);
            });
        }

        function handleCellClick(cell, num) {
            if (gameState === 'ended') return;
        
            if (gameState === 'idle') {
                if (num === 1) {
                    // ========== 昵称校验 ==========
                    const nickname = nicknameInput.value.trim();
                    if (!nickname) {
                        tipText.textContent = '请先输入昵称再开始游戏';
                        tipText.classList.add('error');
                        triggerVibration();
                        return;
                    }
                    // ====================================
                
                    startGame();
                    markCompleted(cell);
                    // 关键：清除所有格子的模糊遮罩
                    document.querySelectorAll('.grid-cell.blur-hide').forEach(el => {
                        el.classList.remove('blur-hide');
                    });
                    targetNumber = 2;
                    updateTip();
                }
                return;
            }
        
            // 后面原有逻辑保持不变
            if (cell.classList.contains('completed')) {
                showError(cell);
                return;
            }
        
            if (num === targetNumber) {
                markCompleted(cell);
                targetNumber++;
                if (targetNumber > GAME_CONFIG[currentLevel].total) {
                    gameWin();
                    return;
                }
                updateTip();
            } else {
                showError(cell);
            }
        }

        function markCompleted(cell) {
            cell.classList.add('completed');
        }

        function showError(cell) {
            errorCount++;
            triggerVibration();
            cell.classList.add('error');
            setTimeout(() => cell.classList.remove('error'), 300);
        }

        function updateTip() {
            tipText.textContent = `请点击数字 ${targetNumber}`;
        }

        function startGame() {
            gameState = 'playing';
            startTime = Date.now();
            remainingTime = GAME_CONFIG[currentLevel].timeLimit;
            errorCount = 0;
            targetNumber = 1;
            timerId = setInterval(updateTimers, 10);
        }

        function updateTimers() {
            const now = Date.now();
            elapsed = now - startTime;
            remainingTime = GAME_CONFIG[currentLevel].timeLimit - elapsed;

            elapsedEl.textContent = formatElapsedTime(elapsed);
            countdownEl.textContent = formatCountdown(Math.max(0, remainingTime));

            if (remainingTime <= 5000) {
                countdownEl.classList.add('danger');
            } else {
                countdownEl.classList.remove('danger');
            }

            if (remainingTime <= 0) gameFail();
        }

        function gameWin() {
            gameState = 'ended';
            clearInterval(timerId);
            countdownEl.classList.remove('danger');

            // 庆祝动画
            const cells = document.querySelectorAll('.grid-cell');
            cells.forEach((cell, i) => {
                setTimeout(() => cell.classList.add('win-celebration'), i * 30);
            });

            // 保存成绩（本地+云端）
            saveRecord(true);
            saveTotalError(errorCount);
            updateBestScoresDisplay();
            loadRankList(); // 刷新排行榜

            setTimeout(() => showResultModal(true), 800);
        }

        function gameFail() {
            gameState = 'ended';
            clearInterval(timerId);
            countdownEl.classList.remove('danger');
            countdownEl.textContent = '0.0';

            saveRecord(false);
            // 累加本局错误到总记录
            saveTotalError(errorCount);
            // 失败后同步刷新成绩面板
            updateBestScoresDisplay();
            refreshTotalErrorUI();
            showResultModal(false);
        }

        function showResultModal(isWin) {
            if (isWin) {
                modalTitle.textContent = '🎉 挑战成功！';
                modalTime.textContent = `用时：${formatElapsedTime(elapsed)}`;
                modalProgress.textContent = '';
            } else {
                modalTitle.textContent = '⏰ 时间到，挑战失败';
                modalTime.textContent = `已用时：${formatElapsedTime(elapsed)}`;
                modalProgress.textContent = `已完成到数字 ${targetNumber - 1}`;
            }
            modalErrors.textContent = `错误次数：${errorCount} 次`;
            resultModal.classList.add('show');
        }

        function resetGame() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }

            gameState = 'idle';
            targetNumber = 1;
            errorCount = 0;
            elapsed = 0;
            remainingTime = GAME_CONFIG[currentLevel].timeLimit;

            elapsedEl.textContent = '00:00.000';
            countdownEl.textContent = formatCountdown(remainingTime);
            countdownEl.classList.remove('danger');
            tipText.textContent = '点击数字 1 开始挑战';
            resultModal.classList.remove('show');

            renderGrid();
        }

        function changeLevel(level) {
            if (currentLevel === level) return;
            currentLevel = level;
            
            difficultyBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.level) === level);
            });

            resetGame();
            updateRankTitle();
            loadRankList(); // 切换难度刷新对应排行榜
        }

        // ========== 成绩存储：本地+云端双备份 ==========
        function saveRecord(isWin) {
            const nickname = nicknameInput.value.trim() || '匿名玩家';
            const level = currentLevel;
            const record = {
                level,
                time: elapsed,
                errors: errorCount,
                isWin,
                timestamp: Date.now()
            };

        // 1. 本地存储（按昵称独立隔离）
        if (isWin) {
            const nickname = nicknameInput.value.trim() || '匿名玩家';
            // 存储Key格式：schulte_best_昵称_难度，每个昵称独立一套记录
            const bestKey = `schulte_best_${nickname}_${level}`;
            const currentBest = localStorage.getItem(bestKey);
            if (!currentBest || elapsed < parseInt(currentBest)) {
                localStorage.setItem(bestKey, elapsed.toString());
            }
        }
            const historyKey = 'schulte_history';
            let history = JSON.parse(localStorage.getItem(historyKey)) || [];
            history.unshift(record);
            if (history.length > 5) history = history.slice(0, 5);
            localStorage.setItem(historyKey, JSON.stringify(history));

            // 2. 云端上传（仅胜利成绩计入排行榜）
            if (isWin && SUPABASE_URL !== "你的Project URL") {
                uploadToCloud(nickname, level, elapsed, errorCount);
            }
        }

        // 上传成绩到云端
        async function uploadToCloud(nickname, level, time, errors) {
            try {
                await sbClient.from('game_records').insert({
                    nickname,
                    level,
                    time,
                    errors
                });
            } catch (e) {
                console.log('成绩上传失败（可能无网络）', e);
            }
        }

        // 加载排行榜（每个昵称仅显示最佳成绩，取Top10）
        async function loadRankList() {
            if (SUPABASE_URL === "你的Project URL") {
                rankList.innerHTML = '<div style="color:#999;font-size:0.85rem;">配置Supabase后显示排行榜</div>';
                return;
            }
        
            try {
                // 先拉取该难度下前100条记录（留足去重空间，避免前10条都是同一人导致榜单不满）
                const { data, error } = await sbClient
                    .from('game_records')
                    .select('nickname, time, level')
                    .eq('level', currentLevel)
                    .eq('is_win', true)
                    .order('time', { ascending: true })
                    .limit(100);
        
                if (error) throw error;
        
                if (data.length === 0) {
                    rankList.innerHTML = '<div style="color:#999;font-size:0.85rem;">暂无记录，快来抢占榜首！</div>';
                    return;
                }
        
                // ========== 核心：按昵称去重，只保留每个人的最佳成绩 ==========
                const bestMap = new Map();
                data.forEach(item => {
                    const name = item.nickname;
                    // 如果该昵称还没记录，或者当前这条用时更短，就更新
                    if (!bestMap.has(name) || item.time < bestMap.get(name).time) {
                        bestMap.set(name, item);
                    }
                });
        
                // 把去重后的结果转成数组，再次按用时升序排序，取前10名
                const rankData = Array.from(bestMap.values())
                    .sort((a, b) => a.time - b.time)
                    .slice(0, 10);
        
                // ========== 渲染排行榜 ==========
                let html = '';
                rankData.forEach((item, index) => {
                    let rankClass = '';
                    if (index === 0) rankClass = 'top1';
                    else if (index === 1) rankClass = 'top2';
                    else if (index === 2) rankClass = 'top3';
        
                    html += `
                        <div class="rank-item">
                            <div class="rank-num ${rankClass}">${index + 1}</div>
                            <div class="rank-name">${item.nickname}</div>
                            <div class="rank-time">${formatElapsedTime(item.time)}</div>
                            <div class="rank-level">${GAME_CONFIG[item.level].label}</div>
                        </div>
                    `;
                });
                rankList.innerHTML = html;
            } catch (e) {
                rankList.innerHTML = '<div style="color:#999;font-size:0.85rem;">排行榜加载失败</div>';
            }
        }

        // 【新增】更新排行榜标题（随当前难度变化）
        function updateRankTitle() {
            rankTitle.textContent = `🏆 全服排行榜（${GAME_CONFIG[currentLevel].label}）`;
        }
        // 获取当前昵称累计总错误
        function getTotalErrorRecord() {
            const nickname = nicknameInput.value.trim() || '匿名玩家';
            const errKey = `schulte_total_err_${nickname}`;
            return parseInt(localStorage.getItem(errKey)) || 0;
        }
        
        // 累加保存总错误次数
        function saveTotalError(addNum) {
            const nickname = nicknameInput.value.trim() || '匿名玩家';
            const errKey = `schulte_total_err_${nickname}`;
            const oldTotal = getTotalErrorRecord();
            const newTotal = oldTotal + addNum;
            localStorage.setItem(errKey, newTotal.toString());
            // 刷新页面显示
            totalErrorCountEl.textContent = newTotal;
        }
        
        // 刷新累计错误显示
        function refreshTotalErrorUI() {
            totalErrorCountEl.textContent = getTotalErrorRecord();
        }
        // 更新个人最佳显示（仅显示当前昵称的成绩）
        function updateBestScoresDisplay() {
            const nickname = nicknameInput.value.trim() || '匿名玩家';
            let html = '';
    
            [3, 5, 6].forEach(level => {
            // 只读取当前昵称对应的最佳记录
                const bestKey = `schulte_best_${nickname}_${level}`;
                const best = localStorage.getItem(bestKey);
                const timeStr = best ? formatElapsedTime(parseInt(best)) : '暂无记录';
                html += `<div class="score-row">
                    <span>${GAME_CONFIG[level].label}</span>
                    <span>${timeStr}</span>
                </div>`;
            });
    
            bestScoresList.innerHTML = html;
        }

        // ========== 事件绑定 ==========
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                changeLevel(parseInt(btn.dataset.level));
            });
        });

        restartBtn.addEventListener('click', resetGame);
        modalCloseBtn.addEventListener('click', () => {
            resultModal.classList.remove('show');
            resetGame();
        });
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) {
                resultModal.classList.remove('show');
                resetGame();
            }
        });

        // ========== 初始化 ==========
        function init() {
            renderGrid();
            updateBestScoresDisplay();
            updateRankTitle();
            loadRankList();
            countdownEl.textContent = formatCountdown(GAME_CONFIG[currentLevel].timeLimit);
            refreshTotalErrorUI();
        }

        init();
    </script>
</body>
</html>
